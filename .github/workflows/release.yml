# referred from: https://github.com/PyO3/maturin/blob/main/.github/workflows/release.yml
name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  DOCKERHUB_IMAGE: hitokoto/jsdelivr-proxy
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  create_release :
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
            token: ${{ github.token }}
            tag: ${{ github.ref_name }}

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

  release:
    name: Build Release
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
# Commented because of Ring is not officially supported on Windows ARM64, Waiting for upstream support.
#          - target: aarch64-pc-windows-msvc
#            os: windows-latest
#            ext: .exe
#            archive: zip
          - target: i686-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
    steps:
#      - name: Install dependencies
#        if: ${{ contains(matrix.target, 'musl') && startsWith(matrix.os, 'ubuntu-latest') }}
#        run: sudo apt-get update && sudo apt-get install -y musl-tools llvm clang

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo build (musl)
        if: ${{ contains(matrix.target, 'musl') && startsWith(matrix.os, 'ubuntu-latest') }}
        run: |
          docker buildx build -t rust-musl-builder -f ./manifest/docker/builder/${{ matrix.target }}/Dockerfile . && \
          docker run -v "$(pwd)":/home/rust/src --rm -t rust-musl-builder rustup toolchain list && \
          docker run -v "$(pwd)":/home/rust/src --rm -t rust-musl-builder bash -c "git config --global --add safe.directory '*' && cargo +nightly build --release --target ${{ matrix.target }}"

      - name: Cargo build
        if: ${{ !contains(matrix.target, 'musl') || !startsWith(matrix.os, 'ubuntu-latest') }}
        run: |
          rustup toolchain install nightly --profile minimal -t ${{ matrix.target }}
          cargo +nightly build --release --target ${{ matrix.target }}

      - name: Packaging Archive .zip
        if:  ${{ startsWith(matrix.os, 'windows-latest') }}
        run: |
          Get-ChildItem -Path .\README.md,.\config.example.toml,.\target\${{ matrix.target }}\release\ -Filter *.exe |
            Compress-Archive -DestinationPath jsdelivr_proxy-${{ matrix.target }}.zip -Force
      - name: Packaging Archive .tar.gz
        if: ${{ !startsWith(matrix.os, 'windows-latest') }}
        run: |
          mkdir -p ./tmp && cp ./README.md ./config.example.toml ./target/${{ matrix.target }}/release/jsdelivr_proxy ./tmp && cd ./tmp && tar -czvf ../jsdelivr_proxy-${{ matrix.target }}.tar.gz . && cd .. && rm -rf ./tmp
      - name: Upload asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          tag: ${{ github.ref }}
          file: jsdelivr_proxy-${{ matrix.target }}.${{ matrix.archive }}
          asset_name: jsdelivr_proxy-${{ matrix.target }}.${{ matrix.archive }}
  docker-release:
    # 每个平台只按 digest 推送（不打 tag），tag 统一由 docker-manifest job 合并后再打。
    # 如果这里直接用 meta.outputs.tags 推送，两条 matrix 分支会推出完全相同的 tag，
    # 后完成的那条会覆盖先完成的，最终 tag 上只剩单一架构的镜像。
    name: Build Docker (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # 推送镜像到 GitHub Packages(ghcr.io) 需要，GITHUB_TOKEN 默认没有这个权限
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            file: ./manifest/docker/release/x86_64-linux-musl/Dockerfile
          - os: ubuntu-latest
            platform: linux/arm64
            file: ./manifest/docker/release/aarch64-linux-musl/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize platform name
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 同一份构建同时发布到 Docker Hub 与 GitHub Packages(ghcr.io)。
          # ghcr 的仓库名直接取 github.repository，因此镜像名随仓库自动跟随，
          # 且 GitHub 会依据下面的 org.opencontainers.image.source 标签把
          # 该 package 自动关联到本仓库。
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/hitokoto-osc/jsdelivr_proxy/master/README.md
            io.artifacthub.package.logo-url=https://cdn.a632079.me/assets/images/hitokoto-logo-512x512.png
            io.artifacthub.package.maintainers=[{"name":"a632079","email":"a632079@qq.com"}]
            io.artifacthub.package.license=Apache-2.0
            org.opencontainers.image.description=jsdelivr proxy
            org.opencontainers.image.name=jsdelivr-proxy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version={{version}}
            org.opencontainers.image.source=https://github.com/hitokoto-osc/jsdelivr_proxy/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    # 把各平台的 digest 合并成一个 manifest list，再打上真正的 tag。
    name: Push Docker manifest
    needs: docker-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}"
