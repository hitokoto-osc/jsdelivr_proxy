services:
  app:
    build:
      context: .
      dockerfile: manifest/docker/release/x86_64-linux-musl/Dockerfile
      args:
        # 国内服务器构建加速（rustup/crates 走 rsproxy 镜像）；海外服务器可删除这两行
        USE_RSPROXY: "1"
    # arm64 机器改用: manifest/docker/release/aarch64-linux-musl/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RUN_ENV: Production
      # 配置支持环境变量覆盖，前缀为 JSDRLIVR_PROXY_（源码里的拼写）
      JSDRLIVR_PROXY_SERVER_HOST: 0.0.0.0
      JSDRLIVR_PROXY_SERVER_PORT: 8000
      # 自定义上游镜像（默认 https://gcore.jsdelivr.net）：
      # JSDRLIVR_PROXY_JSDELIVR_MIRROR: https://gcore.jsdelivr.net
      # 进程内缓存（字段名含下划线，层级用双下划线分隔）：
      # JSDRLIVR_PROXY_CACHE__TTL_SECS: 7200          # 缓存 TTL，默认 2 小时
      # JSDRLIVR_PROXY_CACHE__MAX_CAPACITY_MB: 256    # 缓存总字节预算，默认 256MB
      # JSDRLIVR_PROXY_CACHE__MAX_ENTRY_SIZE_MB: 16   # 单条目上限，超过则不缓存，默认 16MB
      # 资源白名单（反滥用）：列表用逗号分隔，全部留空 / 不设置 = 不限制（默认）。
      # 只要设置了其中任意一项，白名单即生效，未命中的请求返回 403。
      # JSDRLIVR_PROXY_JSDELIVR_ALLOWLIST_PROVIDERS: "npm,gh"
      # JSDRLIVR_PROXY_JSDELIVR_ALLOWLIST_NPM: "vue,@hitokoto/core,@hitokoto"
      # JSDRLIVR_PROXY_JSDELIVR_ALLOWLIST_GH: "hitokoto-osc,hitokoto-osc/sentences-bundle"
    # 如需配置文件方式，改为挂载 ./data 并在其中放 config.toml：
    # volumes:
    #   - ./data:/app/data
