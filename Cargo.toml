[package]
name = "jsdelivr_proxy"
description = "A lightweight JSDelivr Proxy module"
version = "0.3.0"
authors = ["a632079 <a632079@qq.com>"]
keywords = ["hitokoto", "jsdelivr", "proxy"]
license-file = "LICENSE"
repository = "https://github.com/hitokoto-osc/jsdelivr_proxy/"
build = "build.rs"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
chrono = { version = "0.4.22", features = [] }
rustc_version = "0.4"

[dependencies]
anyhow = "1.0.66"
axum = "0.8"
blake3 = "1"
brotli = "9.0.0"
bytes = { version = "1.2.1", features = ["serde"] }
chrono = { version = "0.4.22", features = ["serde"] }
clap = { version = "4.0.20", features = ["derive", "env"] }
colored = "3.1.1"
config = "0.15.25"
hex = "0.4"
hmac = "0.13"
lazy_static = "1.4.0"
moka = { version = "0.12", features = ["future"] }
phf = { version = "0.14.0", features = ["macros"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
timeago = "0.6.1"
tokio = { version = "1.21.1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.37"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
url = "2.3.1"
uuid = { version = "1.2.1", features = ["v1", "v4"] }
zstd = "0.14.0"

# 仅 Linux（musl 静态构建）需要 vendored OpenSSL；Windows/macOS 分别走 schannel / Security Framework
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

