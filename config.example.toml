[jsdelivr]
mirror = "https://gcore.jsdelivr.net"
user_agent = ""
host = ""

[server]
host = "0.0.0.0"
# 默认 28319；docker-compose 通过 JSDRLIVR_PROXY_SERVER_PORT 覆盖为 8000
port = 28319

# 进程内缓存（moka）：无外部依赖，重启即失效
[cache]
# 缓存存活时间（秒），默认 7200（2 小时）
ttl_secs = 7200
# 缓存总字节预算（MB），默认 256
max_capacity_mb = 256
# 单条目字节上限（MB），超过此大小的资源仍会正常返回，只是不进入缓存，默认 16
# 注意：上面两项预算都按**压缩后**的体积核算
max_entry_size_mb = 16
# 缓存条目的压缩算法：none / zstd / brotli，默认 zstd
# 压缩率越高，同样的内存预算能装下越多资源；代价是每次命中都要解压一次
# （none 则是引用计数级别的零拷贝返回）
compression = "zstd"

# 资源白名单（反滥用）：把本代理限制在自家的包 / 仓库上，避免被当成公共开放代理白嫖流量。
# 三个列表**全部为空 / 整节缺省 = 不做任何限制**（默认行为）。
# 只要任意一个列表非空，白名单即生效，未命中的请求返回 403。
# 匹配不区分大小写，且严格按片段整体比较：
#   `hitokoto-osc` 不会匹配 `hitokoto-osc-evil`，`@hitokoto` 也不会匹配 `@hitokoto-evil`。
# [jsdelivr.allowlist]
# 允许的 provider；留空 = 不限制 provider。
# 注意 npm / gh 以外的 provider（wp、esm 等）无法按资源粒度识别，
# 白名单生效时必须在这里显式列出才会放行。
# combine/ 请求会被拆开逐个校验其分量，无需（也不应该）写进这里。
# providers = ["npm", "gh"]
# 允许的 npm 包；留空 = 该 provider 下的所有包都允许。
#   "vue"            精确匹配包名
#   "@hitokoto/core" 精确匹配 scoped 包
#   "@hitokoto"      匹配该 scope 下的所有包
# npm = ["vue", "@hitokoto/core", "@hitokoto"]
# 允许的 GitHub 仓库；留空 = 该 provider 下的所有仓库都允许。
#   "hitokoto-osc"                  匹配该 owner 的全部仓库
#   "hitokoto-osc/sentences-bundle" 精确匹配单个仓库
# gh = ["hitokoto-osc", "hitokoto-osc/sentences-bundle"]

# 资源预载（缓存预热）：把指定仓库 / 包的资源在启动时灌进缓存。
# 整节缺省 / targets 为空 = 不预载（默认）。详见 README。
#
# 预热的缓存键就是客户端请求的路径 `<provider>/<name>@<version>/<file>`，
# 下面的 version 会原样进键，必须和客户端实际请求的版本串一致。
# [preload]
# 省略 = 有 targets 就开
# enabled = true
# 列文件清单用的数据 API，与 jsdelivr.mirror 是两个服务（镜像不提供 /v1/packages）
# data_api = "https://data.jsdelivr.com"
# 省略 = cache.ttl_secs 的 3/4；必须小于 TTL，否则预热的条目会在两轮之间过期
# refresh_interval_secs = 5400
# concurrency = 4
# max_files = 512

# 版本省略时 gh 用 HEAD（仓库默认分支）、npm 用 latest；
# 内容默认取全部前端资源（js/css/json/html/wasm/图片/字体），并跳过 . 开头的隐藏目录。
# [[preload.targets]]
# provider = "gh"
# name = "hitokoto-osc/sentences-bundle"

# 指定版本与内容。gh 的 "latest" 会被归一成 "HEAD"，要最新 tag 请写 tag 或 semver 范围。
# [[preload.targets]]
# provider = "gh"
# name = "hitokoto-osc/sentences-bundle"
# version = "master"
# 覆盖默认扩展名集合；写 ["*"] 则不按扩展名过滤
# extensions = ["json"]
# 路径前缀，按片段整体比较：/dist 命中 /dist/vue.js，但不命中 /dist-old/x.js
# include = ["/sentences", "/categories.json"]
# exclude 优先级高于 include
# exclude = ["/sentences/legacy"]
# include_hidden = false
# max_files = 200
